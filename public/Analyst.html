/* Promvis - design tokens + base styles */

:root {
  --bg: oklch(0.16 0.008 50);
  --bg-elev: oklch(0.19 0.008 50);
  --bg-card: oklch(0.205 0.008 50);
  --border: oklch(0.28 0.008 50 / 0.55);
  --border-strong: oklch(0.38 0.008 50 / 0.7);
  --fg: oklch(0.96 0.006 80);
  --fg-mute: oklch(0.78 0.006 70 / 0.85);
  --fg-soft: oklch(0.62 0.008 60);
  --fg-faint: oklch(0.46 0.008 55);

  --amber: #e8a04a;
  --amber-soft: oklch(0.755 0.13 70 / 0.18);
  --amber-glow: oklch(0.755 0.16 65 / 0.4);

  /* typography tokens - single family, two weights, named tracking */
  --font-sans: "Inter", -apple-system, Arial, sans-serif;
  --weight-regular: 400;
  --weight-bold: 700;
  --track-tight: -0.01em;   /* headlines under ~32px */
  --track-tighter: -0.02em; /* display sizes 32px and up */
  --track-caps: 0.18em;     /* eyebrows, section labels, small descriptors */

  --eyebrow-size: 11px;
  --measure: 64ch;
}

[data-density="compact"]  { --pad-section: 96px;  --pad-x: 56px;  --gap-stack: 14px; }
[data-density="editorial"] { --pad-section: 168px; --pad-x: 96px;  --gap-stack: 22px; }
[data-density="regular"]  { --pad-section: 128px; --pad-x: 72px;  --gap-stack: 18px; }

[data-bg="ink"]    { --bg: oklch(0.13 0.018 260); --bg-elev: oklch(0.16 0.018 260); --bg-card: oklch(0.18 0.018 260); }
[data-bg="cool"]   { --bg: oklch(0.16 0.006 245); --bg-elev: oklch(0.19 0.006 245); --bg-card: oklch(0.205 0.006 245); }
[data-bg="warm"]   { --bg: oklch(0.16 0.008 50);  --bg-elev: oklch(0.19 0.008 50);  --bg-card: oklch(0.205 0.008 50); }
[data-bg="black"]  { --bg: oklch(0.10 0.002 60);  --bg-elev: oklch(0.13 0.002 60);  --bg-card: oklch(0.16 0.002 60); }

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-sans);
  font-weight: var(--weight-regular);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

::selection { background: var(--amber); color: #1a1410; }

.p-eyebrow {
  font-family: var(--font-sans);
  font-size: var(--eyebrow-size);
  letter-spacing: var(--track-caps);
  text-transform: uppercase;
  color: var(--fg-soft);
  font-weight: var(--weight-regular);
  display: flex;
  align-items: center;
}
.p-eyebrow .dot {
  display: inline-block; width: 5px; height: 5px; border-radius: 50%;
  background: var(--amber); margin-right: 10px; vertical-align: 1px;
  box-shadow: 0 0 12px var(--amber-glow); flex-shrink: 0;
}
.p-mono { font-family: var(--font-sans); font-feature-settings: "tnum"; font-variant-numeric: tabular-nums; }
.p-serif { font-family: var(--font-sans); font-weight: var(--weight-bold); letter-spacing: var(--track-tight); }
.p-amber { color: var(--amber); }
.p-mute  { color: var(--fg-mute); }
.p-soft  { color: var(--fg-soft); }

.rule {
  height: 1px; background: linear-gradient(90deg, transparent, var(--border-strong) 12%, var(--border-strong) 88%, transparent);
  width: 100%; border: 0;
}

.section { padding: var(--pad-section) var(--pad-x); position: relative; }
.section-narrow { max-width: 1200px; margin: 0 auto; }

.btn {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--font-sans); font-size: 14px; font-weight: var(--weight-bold);
  padding: 14px 22px; border-radius: 999px;
  cursor: pointer; user-select: none; text-decoration: none;
  transition: transform .15s ease, background .15s, border-color .15s, color .15s;
  border: 1px solid transparent; line-height: 1;
  letter-spacing: normal;
}
.btn .arr { transition: transform .2s ease; display: inline-block; }
.btn:hover .arr { transform: translateX(3px); }

.btn-primary {
  background: var(--amber); color: #1a1208;
  box-shadow: 0 6px 24px -8px var(--amber-glow), inset 0 1px 0 rgba(255,255,255,.25);
}
.btn-primary:hover { background: color-mix(in oklab, var(--amber) 92%, white 8%); }

.btn-ghost {
  background: transparent; color: var(--fg);
  border-color: var(--border-strong);
}
.btn-ghost:hover { border-color: var(--fg-soft); background: rgba(255,255,255,0.03); }

.btn-quiet {
  background: transparent; color: var(--fg-mute); padding: 10px 0;
  border: 0; border-radius: 0; border-bottom: 1px solid var(--border-strong);
}
.btn-quiet:hover { color: var(--amber); border-color: var(--amber); }

.nav {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; justify-content: space-between;
  padding: 22px var(--pad-x);
  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  background: color-mix(in oklab, var(--bg) 78%, transparent);
  border-bottom: 1px solid var(--border);
}
.nav-links { display: flex; gap: 32px; }
.nav-links a {
  color: var(--fg-mute); text-decoration: none; font-size: 13px;
  letter-spacing: normal; transition: color .15s;
}
.nav-links a:hover { color: var(--fg); }
.nav-links a.amber:hover { color: var(--amber); }

.wordmark {
  font-family: var(--font-sans); font-weight: var(--weight-bold);
  letter-spacing: var(--track-caps); font-size: 13px; color: var(--fg);
  display: inline-flex; align-items: center; gap: 12px;
}

.card {
  background: linear-gradient(180deg, var(--bg-card), color-mix(in oklab, var(--bg-card) 92%, black 8%));
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 36px 30px;
  position: relative; overflow: hidden;
}

@keyframes ember-flicker {
  0%, 100% { opacity: 0.9; transform: scale(1) translateY(0); }
  40% { opacity: 1; transform: scale(1.08) translateY(-1px); }
  70% { opacity: 0.7; transform: scale(0.95) translateY(0.5px); }
}
@keyframes ember-rise {
  0% { transform: translateY(0) translateX(0); opacity: 0; }
  10% { opacity: 0.9; }
  100% { transform: translateY(-120px) translateX(var(--drift, 8px)); opacity: 0; }
}
@keyframes horizon-pulse {
  0%, 100% { opacity: 0.85; }
  50% { opacity: 1; }
}

.tnum { font-feature-settings: "tnum"; font-variant-numeric: tabular-nums; }
.ic { stroke: currentColor; fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }

@media (max-width: 768px) {
  :root { --pad-section: 72px; --pad-x: 24px; }
}

const dictionaries = { en, vi };
const LanguageContext = React.createContext({ lang: 'en', setLang: () => {}, t: (k) => k });

function LanguageProvider({ children }) {
  const [lang, setLang] = React.useState(() => {
    if (typeof window === 'undefined') return 'en';
    try {
      const stored = window.localStorage.getItem(LANG_KEY);
      return stored === 'en' || stored === 'vi' ? stored : 'en';
    } catch {
      return 'en';
    }
  });

  React.useEffect(() => {
    if (typeof window === 'undefined') return;
    try {
      window.localStorage.setItem(LANG_KEY, lang);
    } catch {}
  }, [lang]);

  const t = React.useCallback((key) => {
    const dict = dictionaries[lang];
    return dict && dict[key] !== undefined ? dict[key] : key;
  }, [lang]);

  return (
    <LanguageContext.Provider value={{ lang, setLang, t }}>
      {children}
    </LanguageContext.Provider>
  );
}

function useTranslation() {
  return React.useContext(LanguageContext);
}

const accessStore = (() => {
  let open = false;
  let product = 'analyst';
  const subs = new Set();
  return {
    isOpen: () => open,
    product: () => product,
    open(p = 'analyst') { open = true; product = p; subs.forEach(fn => fn()); },
    close() { open = false; subs.forEach(fn => fn()); },
    subscribe(fn) { subs.add(fn); return () => subs.delete(fn); },
  };
})();
window.openAccess = (p) => accessStore.open(p);

function useAccessStore() {
  const [, force] = React.useState(0);
  React.useEffect(() => accessStore.subscribe(() => force(x => x + 1)), []);
  return { open: accessStore.isOpen(), product: accessStore.product() };
}

  const [touched, setTouched] = React.useState(false);

  React.useEffect(() => {
    if (!open) {
      const id = setTimeout(() => {
        setStep('form'); setForm({ name: '', email: '', firm: '', role: '', why: '' }); setTouched(false);
      }, 250);
      return () => clearTimeout(id);
    }
  }, [open]);

  React.useEffect(() => {
    if (!open) return;
    const onKey = (e) => { if (e.key === 'Escape') accessStore.close(); };

        animation: 'access-fade 200ms ease-out',

      <style>{`

        @keyframes access-rise { from { opacity: 0; transform: translateY(16px) } to { opacity: 1; transform: none } }
        .am-field input, .am-field textarea, .am-field select {
          width: 100%; padding: 12px 14px; background: color-mix(in oklab, var(--bg) 70%, var(--bg-elev));

          border-radius: 3px; font-family: var(--font-sans); font-size: 14px;
          line-height: 1.4; outline: none; transition: border-color .15s, background .15s;
          appearance: none;
        }
        .am-field textarea { resize: vertical; min-height: 84px; font-family: var(--font-sans); }
        .am-field input:focus, .am-field textarea:focus, .am-field select:focus {
          border-color: var(--amber); background: color-mix(in oklab, var(--amber) 4%, var(--bg-elev));

        .am-field label {
          display: flex; justify-content: space-between; align-items: baseline;

        .am-field .req { color: var(--amber); }
        .am-field.err input, .am-field.err select, .am-field.err textarea { border-color: oklch(0.65 0.16 28); }
      `}</style>

      <div
        onClick={(e) => e.stopPropagation()}
        style={{
          width: '100%', maxWidth: 520,
          background: 'linear-gradient(180deg, var(--bg-elev), color-mix(in oklab, var(--bg-elev) 85%, black))',

                <label>{t('Role')} <span className="req">*</span></label>
                <select value={form.role} onChange={(e) => setForm({ ...form, role: e.target.value })}>
                  <option value="" disabled>{t('Choose…')}</option>
                  {ROLES.map(r => <option key={r} value={r}>{t(r)}</option>)}
                </select>
              </div>
            </div>

            <div className="am-field" style={{ marginTop: 14 }}>
              <label>
                <span>{product === 'forge' ? t('Dataset of interest') : t('Why Promvis Analyst, why now?')}</span>
                <span style={{ color: 'var(--fg-faint)' }}>{t('optional · 1-2 lines')}</span>

              <textarea

  );

function AMField({ label, req, field, form, setForm, placeholder, type = 'text', touched, valid = true, errorMsg }) {
  const showErr = touched && !valid;
  return (
    <div className={'am-field' + (showErr ? ' err' : '')}>
      <label>
        <span>{label}{req && <span className="req"> *</span>}</span>
        {showErr && errorMsg && <span style={{ color: 'oklch(0.7 0.16 28)', textTransform: 'none', letterSpacing: 0 }}>{errorMsg}</span>}
      </label>
      <input
        type={type} value={form[field]} placeholder={placeholder}
        onChange={(e) => setForm({ ...form, [field]: e.target.value })}
      />
    </div>
  );
}

function EmberField({ mobile }) {
  const embers = React.useMemo(() => Array.from({ length: mobile ? 8 : 18 }, () => ({

    <div aria-hidden style={{ position: 'absolute', inset: 0, pointerEvents: 'none', overflow: 'hidden' }}>

function routeColor(kind, alpha) {
  const base = { route: '#7cc1a0', answer: 'var(--amber)', decline: '#c8c1b3', refuse: '#d68585' }[kind] || 'var(--fg-mute)';
  if (alpha != null) return `color-mix(in oklab, ${base} ${alpha * 100}%, transparent)`;
  return base;
}
